<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>OIGNON SAFE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap">
<style>
/* Concept : une application mobile en colonne unique, grandes zones tactiles, couleurs du pitch deck (bleu nuit, orange, vert). */
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#12233f; --muted:#56667f; --line:#d5deec;
  --primary:#12315c; --on-primary:#ffffff; --accent:#f28c28; --on-accent:#12233f; --navy:#12315c;
  --green:#1b8456; --green-tint:#e3f4ec; --amber:#935200; --amber-tint:#fdf0dc;
  --red:#b73125; --red-tint:#fbe6e3; --blue:#1f6fd1; --blue-tint:#e4eefb;
  --violet:#6b3fc4; --violet-tint:#efe8fb; --focus:#1f6fd1;
  --font-display:'Poppins',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1424; --surface:#142238; --ink:#e9eff9; --muted:#a3b3cd; --line:#26385a;
  --primary:#5a9bf0; --on-primary:#08121f; --accent:#f28c28; --on-accent:#12233f;
  --green:#4cc38a; --green-tint:#12352a; --amber:#f0b25a; --amber-tint:#3a2a10;
  --red:#ff8a7d; --red-tint:#3d1a17; --blue:#6aa8f5; --blue-tint:#162b4a;
  --violet:#b79bf2; --violet-tint:#2a1f47; --focus:#8bbcff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1424; --surface:#142238; --ink:#e9eff9; --muted:#a3b3cd; --line:#26385a;
  --primary:#5a9bf0; --on-primary:#08121f; --accent:#f28c28; --on-accent:#12233f;
  --green:#4cc38a; --green-tint:#12352a; --amber:#f0b25a; --amber-tint:#3a2a10;
  --red:#ff8a7d; --red-tint:#3d1a17; --blue:#6aa8f5; --blue-tint:#162b4a;
  --violet:#b79bf2; --violet-tint:#2a1f47; --focus:#8bbcff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);
  padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 1.5rem/1.2 var(--font-display);text-wrap:balance;margin:0}
h2{font:700 1.1rem/1.25 var(--font-display);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 1.05rem var(--font-display);letter-spacing:.03em}
.logo{width:38px;height:38px;border-radius:11px;background:var(--navy);color:var(--accent);display:grid;place-items:center}
.top-r{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  font-weight:600;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.net.off .dot{background:var(--amber)}
.ic{display:block;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pagehead{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.back{min-height:44px;padding:0 14px 0 8px;border-radius:12px;border:0;background:transparent;color:var(--primary);
  font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:128px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;
  text-align:left;cursor:pointer;font:700 1.05rem/1.2 var(--font-display);min-width:0}
.tile small{display:block;font:400 .85rem/1.3 var(--font-body);color:var(--muted);margin-top:3px}
.tile.hero{grid-column:1/-1;background:var(--accent);color:var(--on-accent);border-color:transparent;
  flex-direction:row;align-items:center;min-height:104px;font-size:1.25rem}
.tile.hero small{color:inherit}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico.n{background:var(--navy);color:var(--accent)}
.ico.g{background:var(--green-tint);color:var(--green)}
.ico.b{background:var(--blue-tint);color:var(--blue)}
.ico.v{background:var(--violet-tint);color:var(--violet)}
.ico.a{background:var(--amber-tint);color:var(--amber)}

.btn{min-height:56px;border-radius:14px;border:0;font:700 1.05rem var(--font-display);padding:0 18px;cursor:pointer;
  background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red);color:var(--bg)}
.btn.sm{min-height:46px;font-size:.95rem;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

label{font-weight:600;font-size:.95rem;display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 12px;font-size:1.05rem}
textarea{padding:10px 12px;min-height:110px;font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace}
.form{gap:14px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg button{min-height:48px;border-radius:10px;border:0;background:transparent;font-weight:600;cursor:pointer}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.dots{display:flex;justify-content:center;gap:14px;padding:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--primary);border-color:var(--primary)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:700 1.5rem var(--font-display);cursor:pointer}
.key.s{font-size:1rem;border-style:dashed}

.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:14px;font-weight:600;font-size:.82rem;white-space:nowrap}
.pill.good{background:var(--green-tint);color:var(--green)}
.pill.warn{background:var(--amber-tint);color:var(--amber)}
.pill.bad{background:var(--red-tint);color:var(--red)}
.pill.info{background:var(--blue-tint);color:var(--blue)}
.lot-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lot-head>div{min-width:0}
.big{font:700 2rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.big small{font:500 .95rem var(--font-body);color:var(--muted)}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.states button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;cursor:pointer;padding:0 4px}
.states button.on.good{background:var(--green-tint);border-color:var(--green);color:var(--green)}
.states button.on.warn{background:var(--amber-tint);border-color:var(--amber);color:var(--amber)}
.states button.on.bad{background:var(--red-tint);border-color:var(--red);color:var(--red)}
.states.ans button.good{border-color:var(--green);color:var(--green)}
.states.ans button.warn{border-color:var(--amber);color:var(--amber)}
.states.ans button.bad{border-color:var(--red);color:var(--red)}
.inline{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.ask{background:var(--amber-tint);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

.alert{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.alert.warn{background:var(--amber-tint);color:var(--amber)}
.alert.bad{background:var(--red-tint);color:var(--red)}
.alert.good{background:var(--green-tint);color:var(--green)}
.alert strong{display:block}
.alert p{color:var(--ink);font-size:.92rem}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.days div{background:var(--bg);border-radius:12px;padding:8px 2px;min-width:0}
.days b{display:block;font:700 1.15rem var(--font-display);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat.wait{border-color:var(--accent)}
.stat b{display:block;font:700 1.4rem/1.2 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tag{font-size:.78rem;color:var(--amber);font-weight:600}
.hint{background:var(--blue-tint);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.88rem}
.logline{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;border-bottom:1px solid var(--line);padding:6px 0}
.logline span:last-child{color:var(--muted);white-space:nowrap}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.langs button{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.langs button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.foot{text-align:center;font-size:.8rem;color:var(--muted)}
.toastbox{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;max-width:440px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.tile.hero{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"><p class="muted">Chargement…</p></main>
  <p class="foot">Prototype de démonstration. Les données restent sur cet appareil.</p>
</div>
<div class="toastbox" aria-live="polite"><div class="toast" id="toast" hidden></div></div>

<script>
(function(){
'use strict';
var KEY='oignonsafe.v1', mem=null, db=null;
var session=null, screen='login', role='resp', loginPid='', pin='', busy=false;
var ui={online:!(typeof navigator!=='undefined'&&navigator.onLine===false),open:null,ans:null,done:null,confirm:null,lang:'fr'};

/* ---------- utilitaires ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n*10)/10)}
function pad2(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function today(){return dstr(new Date())}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return dstr(d)}
function daysSince(s){try{return Math.floor((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/86400000)}catch(e){return 0}}
function fdate(s){try{return new Date(s+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}catch(e){return s}}
function ftime(t){try{return new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function rnd(){try{return Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(8)),function(x){return pad2(x.toString(16))}).join('')}catch(e){return Math.random().toString(16).slice(2,18)}}
function rndPin(){try{return String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,'0')}catch(e){return String(Math.floor(Math.random()*10000)).padStart(4,'0')}}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function num(id){var v=val(id).replace(',','.');return v===''?NaN:Number(v)}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

var P={
 onion:'<path d="M12 2.5c.3 2-.6 3.2-1.8 4.2C7.2 8.2 5 10.8 5 14a7 6.5 0 0 0 14 0c0-3.2-2.2-5.8-5.2-7.3C12.6 5.7 11.7 4.5 12 2.5z"/><path d="M12 7.5c-1.6 2-2.4 4.2-2.4 6.5M12 7.5c1.6 2 2.4 4.2 2.4 6.5"/>',
 store:'<path d="M3 10l9-6 9 6v10H3z"/><path d="M8 20v-6h8v6"/>',
 bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
 people:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 5"/>',
 chart:'<path d="M4 20V4M4 20h16"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
 sound:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
 sun:'<circle cx="8" cy="9" r="3.2"/><path d="M8 2.5V4M8 14v1.5M1.5 9H3M13 9h1.5M3.4 4.4l1 1M11.6 4.4l-1 1"/><path d="M9 19h8.5a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.3 1.2A3 3 0 0 0 9 19z"/>',
 shield:'<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 sync:'<path d="M20 11a8 8 0 0 0-14-4M4 13a8 8 0 0 0 14 4"/><path d="M6 3v4h4M18 21v-4h-4"/>',
 warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'
};
function ic(n,s){s=s||24;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'}

/* ---------- sécurité : hachage des codes ---------- */
async function hashPin(p,salt){
  try{ if(window.crypto&&crypto.subtle){
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p));
    return Array.prototype.map.call(new Uint8Array(b),function(x){return pad2(x.toString(16))}).join('');
  }}catch(e){}
  var h=2166136261,s=salt+':'+p;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return 'f'+h.toString(16);
}
async function mkCred(p){var salt=rnd();return{salt:salt,hash:await hashPin(p,salt)}}

/* ---------- données ---------- */
/* Les anciennes ventes (sales) deviennent des sorties déclarées « vendu ». */
function migrate(d){
  if(!Array.isArray(d.exits)){
    d.exits=(d.sales||[]).map(function(s){return{id:s.id,lotId:s.lotId,kg:s.kg,date:(s.date||'').slice(0,10)||today(),status:'vendu',amount:Math.round(s.kg*s.price),synced:!!s.synced}});
  }
  delete d.sales;delete d.buyers;
  d.lock=d.lock||{};d.audit=Array.isArray(d.audit)?d.audit:[];
  return d;
}
function loadDb(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.v===1&&Array.isArray(d.lots))return migrate(d)}}catch(e){}return mem}
function saveDb(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
async function seed(){
  var c1=await mkCred('1111'),c2=await mkCred('2222'),c3=await mkCred('3333');
  return {v:1,demo:true,lastSync:null,lock:{},audit:[],
    manager:await mkCred('1234'),
    producers:[
      {id:'p1',name:'Mamadou Ba',phone:'',salt:c1.salt,hash:c1.hash},
      {id:'p2',name:'Aïssata Sow',phone:'',salt:c2.salt,hash:c2.hash},
      {id:'p3',name:'Ousmane Diallo',phone:'',salt:c3.salt,hash:c3.hash}],
    lots:[
      {id:'l1',pid:'p1',kg:400,date:daysAgo(14),state:'bon',lost:0,synced:true},
      {id:'l2',pid:'p2',kg:250,date:daysAgo(9),state:'surveiller',lost:15,synced:true},
      {id:'l3',pid:'p3',kg:600,date:daysAgo(3),state:'bon',lost:0,synced:true}],
    exits:[
      {id:'e1',lotId:'l1',kg:100,date:daysAgo(5),status:'vendu',amount:25000,synced:true},
      {id:'e2',lotId:'l2',kg:50,date:daysAgo(8),status:'attente',amount:0,synced:true}]};
}
function audit(what,who){
  db.audit.push({t:Date.now(),who:who||(session?session.name:'—'),what:what});
  if(db.audit.length>60)db.audit=db.audit.slice(-60);
}
function prod(id){return db.producers.find(function(p){return p.id===id})}
function lot(id){return db.lots.find(function(l){return l.id===id})}
function exitsOf(l){return db.exits.filter(function(e){return e.lotId===l.id})}
function outKg(l){return exitsOf(l).reduce(function(a,e){return a+e.kg},0)}
function stored(l){return Math.max(0,Math.round((l.kg-outKg(l)-l.lost)*100)/100)}
function myLots(){return session&&session.role==='prod'?db.lots.filter(function(l){return l.pid===session.pid}):db.lots}
/* stock = déposé − sorti − perdu dans le hangar. Les sorties sont ensuite réparties : vendu, consommé, perdu, en attente. */
function totals(lots){
  var t={dep:0,sold:0,conso:0,lost:0,wait:0,rev:0};
  lots.forEach(function(l){
    t.dep+=l.kg;t.lost+=l.lost;
    exitsOf(l).forEach(function(e){
      if(e.status==='vendu'){t.sold+=e.kg;t.rev+=e.amount||0}
      else if(e.status==='consomme')t.conso+=e.kg;
      else if(e.status==='perdu')t.lost+=e.kg;
      else t.wait+=e.kg;
    });
  });
  t.stock=t.dep-t.sold-t.conso-t.lost-t.wait;return t;
}
function pending(){
  var n=0;db.lots.forEach(function(l){if(!l.synced)n++});db.exits.forEach(function(s){if(!s.synced)n++});return n;
}
function isResp(){return session&&session.role==='resp'}
function canAnswer(e){var l=lot(e.lotId);return isResp()||(session&&session.role==='prod'&&l&&l.pid===session.pid)}
function waitingExits(){return db.exits.filter(function(e){return e.status==='attente'&&canAnswer(e)})}

/* ---------- météo (exemple) ---------- */
var METEO={
  source:'Exemple de démonstration. Le service météo sera choisi avec les producteurs (par exemple l’ANACIM).',
  maj:'Mis à jour : lundi 16 novembre, 06 h 00 (exemple)',
  days:[{d:'Lun',t:38,r:0},{d:'Mar',t:41,r:0},{d:'Mer',t:40,r:10},{d:'Jeu',t:36,r:70},{d:'Ven',t:37,r:20}]
};
var DAYN={Lun:'lundi',Mar:'mardi',Mer:'mercredi',Jeu:'jeudi',Ven:'vendredi'};
function alerts(){
  var a=[];
  METEO.days.forEach(function(x){
    if(x.r>=50)a.push({lv:'bad',day:x.d,title:'Pluie probable',text:'Rentrez les oignons qui sèchent, couvrez les tas et vérifiez la toiture avant la pluie.'});
    else if(x.r>=20)a.push({lv:'warn',day:x.d,title:'Risque de pluie',text:'Gardez des bâches prêtes et surveillez le ciel.'});
    if(x.t>=40)a.push({lv:'warn',day:x.d,title:'Forte chaleur',text:'Ne faites pas sécher les oignons entre 11 h et 16 h. Aérez le hangar tôt le matin et le soir.'});
  });
  var rank={bad:0,warn:1};
  a.sort(function(p,q){return rank[p.lv]-rank[q.lv]});
  return a;
}

/* ---------- connexion ---------- */
async function submitPin(){
  if(busy)return;busy=true;
  try{
    if(role==='prod')loginPid=val('who')||loginPid;
    var key=role==='resp'?'resp':loginPid;
    var acc=role==='resp'?db.manager:prod(loginPid);
    var typed=pin;pin='';
    if(!acc){toast('Choisissez un producteur.');return}
    var lk=db.lock[key]||(db.lock[key]={n:0,until:0});
    if(Date.now()<lk.until){toast('Trop d’essais. Attendez '+Math.ceil((lk.until-Date.now())/1000)+' secondes.');return}
    var ok=(await hashPin(typed,acc.salt))===acc.hash;
    if(!ok){
      lk.n++;
      audit('Code faux ('+(role==='resp'?'responsable':acc.name)+')','—');
      if(lk.n>=3){lk.n=0;lk.until=Date.now()+30000;toast('Code faux. Accès bloqué 30 secondes.')}
      else toast('Code faux. Essai '+lk.n+' sur 3.');
      saveDb();return;
    }
    lk.n=0;lk.until=0;
    session=role==='resp'?{role:'resp',name:'Responsable'}:{role:'prod',pid:acc.id,name:acc.name};
    audit('Connexion');saveDb();go('home');
  }finally{busy=false;if(screen==='login')updateDots()}
}

/* ---------- actions ---------- */
function resolveExit(id,status,amount){
  var e=db.exits.find(function(x){return x.id===id});
  if(!e||e.status!=='attente')return;
  if(!canAnswer(e)){toast('Cette sortie ne vous concerne pas.');return}
  e.status=status;e.amount=status==='vendu'?amount:0;e.synced=false;
  audit('Réponse : '+fmt(e.kg)+' kg '+USE[status][1].toLowerCase()+(status==='vendu'?' pour '+fmt(amount)+' FCFA':''));
  saveDb();ui.ans=null;render();toast('Réponse enregistrée.');
}
async function act(el){
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  var needResp=['state','open','exit-ok','loss-ok','sync','backup','restore','setpin','clear','clear-ok'];
  if(needResp.indexOf(a)>=0&&!isResp()){toast('Réservé au responsable.');return}
  switch(a){
    case 'role':role=v;pin='';render();break;
    case 'key':if(pin.length<4){pin+=v;updateDots();if(pin.length===4)submitPin()}break;
    case 'del':pin=pin.slice(0,-1);updateDots();break;
    case 'logout':audit('Déconnexion');saveDb();session=null;pin='';go('login');break;
    case 'home':go('home');break;
    case 'go':go(v);break;
    case 'again':ui.done=null;render();break;
    case 'cancel':ui.open=null;ui.ans=null;ui.confirm=null;render();break;
    case 'net':ui.online=!ui.online;renderTop();if(screen==='home')render();toast(ui.online?'Réseau disponible.':'Hors connexion : l’application continue de fonctionner.');break;
    case 'lang':ui.lang=v;render();break;
    case 'speak':var t=TIPS.find(function(x){return x.k===v});if(t)speak(t.t+'. '+t.x);break;
    case 'speak-alert':var al=alerts()[Number(v)];if(al)speak(DAYN[al.day]+'. '+al.title+'. '+al.text);break;
    case 'state':var l=lot(id);if(l){l.state=v;l.synced=false;audit('État du lot de '+(prod(l.pid)||{name:'?'}).name+' : '+stateInfo(v)[1]);saveDb();render()}break;
    case 'open':ui.open={id:id,mode:v};ui.ans=null;render();break;
    case 'exit-ok':{
      var l2=lot(ui.open&&ui.open.id);if(!l2)break;
      var kg=num('f-kg');
      if(!(kg>0)){toast('Indiquez les kg sortis.');break}
      if(kg>stored(l2)){toast('Il ne reste que '+fmt(stored(l2))+' kg dans ce lot.');break}
      db.exits.push({id:rnd(),lotId:l2.id,kg:kg,date:today(),status:'attente',amount:0,synced:false});
      audit('Sortie de '+fmt(kg)+' kg ('+(prod(l2.pid)||{name:'?'}).name+')');saveDb();ui.open=null;render();toast('Sortie enregistrée. En attente de réponse du producteur.');break}
    case 'loss-ok':{
      var l3=lot(ui.open&&ui.open.id);if(!l3)break;
      var k2=num('f-kg');
      if(!(k2>0)){toast('Indiquez les kg perdus.');break}
      if(k2>stored(l3)){toast('Il ne reste que '+fmt(stored(l3))+' kg dans ce lot.');break}
      l3.lost=Math.round((l3.lost+k2)*100)/100;l3.synced=false;
      audit('Perte de '+fmt(k2)+' kg au hangar');saveDb();ui.open=null;render();toast('Perte enregistrée.');break}
    case 'ans':
      if(v==='vendu'){ui.ans={id:id};render()}
      else resolveExit(id,v,0);
      break;
    case 'ans-ok':{
      if(val('f-amt')===''){toast('Indiquez le montant reçu.');break}
      var amt=num('f-amt');
      if(!(amt>=0)){toast('Montant invalide.');break}
      resolveExit(id,'vendu',Math.round(amt));break}
    case 'sync':
      if(!ui.online){toast('Pas de réseau. Les données restent sur le téléphone.');break}
      db.lots.forEach(function(x){x.synced=true});db.exits.forEach(function(x){x.synced=true});
      db.lastSync=Date.now();audit('Synchronisation (simulée)');saveDb();render();toast('Synchronisation terminée.');break;
    case 'backup':
      ui.backup=JSON.stringify(db);render();
      try{await navigator.clipboard.writeText(ui.backup);toast('Sauvegarde copiée.')}catch(e){var bk=document.getElementById('bk');if(bk){bk.focus();bk.select()}toast('Sélectionnez le texte pour le copier.')}
      break;
    case 'restore':{
      var raw=val('restore');if(!raw){toast('Collez d’abord une sauvegarde.');break}
      try{var d=JSON.parse(raw);
        if(!d||d.v!==1||!Array.isArray(d.lots)||!Array.isArray(d.producers)||!(Array.isArray(d.exits)||Array.isArray(d.sales))||!d.manager||!d.manager.hash)throw 0;
        db=migrate(d);audit('Sauvegarde restaurée');saveDb();ui.backup=null;render();toast('Sauvegarde restaurée.');
      }catch(e){toast('Cette sauvegarde n’est pas valide.')}
      break}
    case 'setpin':{
      var np=val('newpin');
      if(!/^\d{4}$/.test(np)){toast('Le code doit avoir 4 chiffres.');break}
      if(np==='1234'||np==='0000'){toast('Choisissez un code moins facile à deviner.');break}
      var c=await mkCred(np);db.manager=c;audit('Code du responsable changé');saveDb();render();toast('Code changé.');break}
    case 'clear':ui.confirm='clear';render();break;
    case 'clear-ok':db.producers=[];db.lots=[];db.exits=[];db.demo=false;ui.confirm=null;audit('Données d’exemple effacées');saveDb();render();toast('Exemples effacés.');break;
  }
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el&&!el.disabled)act(el)});
document.addEventListener('change',function(e){
  if(e.target.id==='who'){loginPid=e.target.value;pin='';updateDots()}
  if(e.target.id==='h-prod'){var np=document.getElementById('np');if(np)np.hidden=e.target.value!=='__new'}
});
document.addEventListener('keydown',function(e){
  if(screen!=='login'||session||e.target.closest('input,select,textarea'))return;
  if(/^\d$/.test(e.key)&&pin.length<4){pin+=e.key;updateDots();if(pin.length===4)submitPin()}
  else if(e.key==='Backspace'){pin=pin.slice(0,-1);updateDots()}
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  if(!isResp())return;
  if(e.target.id==='hform'){
    var sel=val('h-prod'),name='',pinOut=null,p;
    if(sel==='__new'){
      name=val('h-name');if(!name){toast('Écrivez le nom du producteur.');return}
      pinOut=rndPin();var c=await mkCred(pinOut);
      p={id:rnd(),name:name,phone:val('h-phone'),salt:c.salt,hash:c.hash};
    }else{p=prod(sel);if(!p){toast('Choisissez un producteur.');return}}
    var kg=num('h-kg'),d=val('h-date');
    if(!(kg>0)){toast('Indiquez la quantité en kg.');return}
    if(!d||d>today()){toast('Choisissez une date valide.');return}
    if(sel==='__new')db.producers.push(p);
    db.lots.push({id:rnd(),pid:p.id,kg:kg,date:d,state:'bon',lost:0,synced:false});
    audit('Entrée de '+fmt(kg)+' kg pour '+p.name);saveDb();
    ui.done={name:p.name,kg:kg,date:d,pin:pinOut};render();
  }
});

/* ---------- démarrage ---------- */
(async function init(){
  db=loadDb();
  if(!db){db=await seed();saveDb()}
  else saveDb();
  render();
})();
})();
</script>
</body>
